name: Release

# Trigger: push a version tag like v4.0.0, v4.1.0-alpha.1, v4.1.0-beta.2, v4.1.0-rc.1
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build plugin zip + publish GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to create GitHub Release

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Parse version + resolve zip name ─────────────────────────────────────
      # Stable:    v4.0.0         → Opencart4_Nimbbl.ocmod.zip
      # Alpha:     v4.1.0-alpha.1 → Opencart4_Nimbbl-alpha.1.ocmod.zip
      # Beta:      v4.1.0-beta.2  → Opencart4_Nimbbl-beta.2.ocmod.zip
      # RC:        v4.1.0-rc.1    → Opencart4_Nimbbl-rc.1.ocmod.zip
      - name: Parse version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

          PRERELEASE="${VERSION#*-}"
          if [[ "$PRERELEASE" == "$VERSION" ]]; then
            ZIP_NAME="Opencart4_Nimbbl.ocmod.zip"
          else
            ZIP_NAME="Opencart4_Nimbbl-${PRERELEASE}.ocmod.zip"
          fi
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      # ── PHP + Composer (only if SDK is not bundled) ───────────────────────────
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Install Composer dependencies
        working-directory: src/opencart4
        run: |
          BUNDLED=upload/extension/nimbbl/system/library/nimbbl-sdk/autoload.php
          if [ -f "$BUNDLED" ]; then
            echo "Bundled SDK found — skipping Composer install"
          else
            composer install --no-dev --optimize-autoloader --no-interaction
          fi

      # ── Build zip ─────────────────────────────────────────────────────────────
      - name: Build zip
        run: bash src/build.sh "${{ steps.version.outputs.VERSION }}"

      # ── GitHub Release ────────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Nimbbl OpenCart 4 v${{ steps.version.outputs.VERSION }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: public/opencart4/v${{ steps.version.outputs.VERSION }}/${{ steps.version.outputs.ZIP_NAME }}
          body: |
            ## Nimbbl Payment Gateway for OpenCart 4 — v${{ steps.version.outputs.VERSION }}

            ### Installation
            1. OpenCart Admin → Extensions → Installer → Upload `${{ steps.version.outputs.ZIP_NAME }}`
            2. Extensions → Payments → Nimbbl → Install → Edit
            3. Enter Test/Live API credentials and save.

            ### Changelog
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
