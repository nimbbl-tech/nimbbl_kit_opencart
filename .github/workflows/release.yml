name: Release

# Trigger: push a version tag like v4.0.0, v4.1.0-alpha.1, v4.1.0-beta.2, v4.1.0-rc.1
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build plugin zip + publish GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to create GitHub Release

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Parse version + resolve zip name ─────────────────────────────────────
      # OC4 Extension Installer uses the zip filename as the extension code,
      # so the zip MUST be named nimbbl[-(prerelease)].ocmod.zip.
      #
      # Stable:  v4.0.0         → nimbbl.ocmod.zip
      # Alpha:   v4.1.0-alpha.1 → nimbbl-alpha.1.ocmod.zip
      # Beta:    v4.1.0-beta.2  → nimbbl-beta.2.ocmod.zip
      # RC:      v4.1.0-rc.1    → nimbbl-rc.1.ocmod.zip
      - name: Parse version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

          PRERELEASE="${VERSION#*-}"
          if [[ "$PRERELEASE" == "$VERSION" ]]; then
            ZIP_NAME="nimbbl.ocmod.zip"
          else
            ZIP_NAME="nimbbl-${PRERELEASE}.ocmod.zip"
          fi
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      # ── Build zip ─────────────────────────────────────────────────────────────
      - name: Build zip
        run: bash src/build.sh "${{ steps.version.outputs.VERSION }}"

      # ── GitHub Release ────────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Nimbbl OpenCart 4 v${{ steps.version.outputs.VERSION }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: public/opencart4/v${{ steps.version.outputs.VERSION }}/${{ steps.version.outputs.ZIP_NAME }}
          body: |
            ## Nimbbl Payment Gateway for OpenCart 4 — v${{ steps.version.outputs.VERSION }}

            ### Installation
            1. OpenCart Admin → **Extensions → Installer** → Upload `${{ steps.version.outputs.ZIP_NAME }}`
            2. **Extensions → Payments → Nimbbl** → Install → Edit
            3. Enter Test/Live API credentials and save.

            ### Changelog
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
